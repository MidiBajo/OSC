<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYNTHBAJO - Touch Pad Synth (iOS Green Edition)</title>
    <style>
        body {
            background: linear-gradient(135deg, #132e25 0%, #061510 100%);
            color: #ecfdf5;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            touch-action: none;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(19, 46, 37, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(52, 211, 153, 0.12);
            border-radius: 20px;
            padding: 18px;
            box-sizing: border-box;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        h2 {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            margin: 0 0 12px 0;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .section-label {
            font-size: 11px;
            font-weight: 600;
            color: #6ee7b7;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        select, button {
            background: rgba(20, 60, 45, 0.6);
            color: #d1fae5;
            border: 1px solid rgba(52, 211, 153, 0.08);
            border-radius: 10px;
            padding: 8px;
            font-size: 11px;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
        }
        select:hover, button:hover {
            background: rgba(30, 90, 65, 0.8);
            border-color: rgba(52, 211, 153, 0.2);
        }
        button.active {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        .control-box {
            background: rgba(10, 40, 30, 0.5);
            border: 1px solid rgba(52, 211, 153, 0.06);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            margin-bottom: 8px;
        }
        .control-box label {
            font-size: 11px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #a7f3d0;
        }
        .control-box input[type=range] {
            width: 100%;
            accent-color: #10b981;
            cursor: pointer;
        }
        /* Touch Pad stile Kaossilator */
        .kaos-pad {
            position: relative;
            background: radial-gradient(circle at center, #065f46 0%, #022c22 100%);
            border-radius: 14px;
            width: 100%;
            height: 220px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            box-sizing: border-box;
            box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            margin: 6px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .kaos-pad-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(52, 211, 153, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(52, 211, 153, 0.05) 1px, transparent 1px);
            background-size: 25px 25px;
        }
        .kaos-instruction {
            position: absolute;
            color: rgba(167, 243, 208, 0.4);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            pointer-events: none;
            text-align: center;
        }
        .touch-point {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle, #34d399 0%, #047857 70%);
            box-shadow: 0 0 20px #34d399;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>KAOSS-BAJO SYNTH</h2>

    <!-- Selezione Forma d'Onda -->
    <div class="section-label">Forma d'Onda:</div>
    <div class="row">
        <button class="active" data-wave="sine">Sine</button>
        <button data-wave="square">Square</button>
        <button data-wave="sawtooth">Saw</button>
        <button data-wave="triangle">Tri</button>
    </div>

    <!-- Touch Pad X/Y Principale -->
    <div class="section-label">X/Y Touch Pad (Asse X: Pitch / Asse Y: Filtro):</div>
    <div class="kaos-pad" id="kaosPad">
        <div class="kaos-pad-grid"></div>
        <div class="kaos-instruction" id="kaosText">TOCCA E SCORRI QUI</div>
        <div class="touch-point" id="touchPoint"></div>
    </div>

    <!-- Controllo Volume / Master -->
    <div class="control-box">
        <label id="volumeLabel">VOLUME: 70%</label>
        <input type="range" id="volumeRange" min="0" max="100" value="70">
    </div>

    <!-- Effetti / Modulatori Extra -->
    <div class="section-label">Modulatori & FX:</div>
    <div class="row">
        <button id="btnArp" class="active">ARP GATE</button>
        <button id="btnDelay" class="active">DELAY</button>
        <button id="btnReverb"class="active">SPACE</button>
    </div>
</div>

<script>
    let audioCtx = null;
    let osc = null;
    let gainNode = null;
    let filterNode = null;
    let delayNode = null;
    let delayFeedback = null;
    let convolverNode = null;
    let masterGain = null;
    
    let currentWave = 'sine';
    let masterVolume = 0.7;
    let isTouching = false;
    let arpInterval = null;

    const pad = document.getElementById('kaosPad');
    const touchPoint = document.getElementById('touchPoint');
    const kaosText = document.getElementById('kaosText');

    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // Catena Effetti Master
            masterGain = audioCtx.createGain();
            masterGain.gain.value = masterVolume * 0.3;

            // 1. Configurazione Delay
            delayNode = audioCtx.createDelay();
            delayNode.delayTime.value = 0.35; // Tempo eco
            delayFeedback = audioCtx.createGain();
            delayFeedback.gain.value = 0.4; // Quantità ripetizioni
            
            delayNode.connect(delayFeedback);
            delayFeedback.connect(delayNode);

            // 2. Configurazione Reverb (Space) tramite rumore convoluzionale sintetico
            convolverNode = audioCtx.createConvolver();
            createReverbImpulse();

            // Collegamenti FX al Master
            masterGain.connect(audioCtx.destination);
            if (document.getElementById('btnDelay').classList.contains('active')) {
                masterGain.connect(delayNode);
                delayNode.connect(audioCtx.destination);
            }
            if (document.getElementById('btnReverb').classList.contains('active')) {
                masterGain.connect(convolverNode);
                convolverNode.connect(audioCtx.destination);
            }
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // Generatore di impulso per il riverbero Space
    function createReverbImpulse() {
        if (!audioCtx) return;
        let rate = audioCtx.sampleRate;
        let length = rate * 2.0; // 2 secondi di eco
        let impulse = audioCtx.createBuffer(2, length, rate);
        let left = impulse.getChannelData(0);
        let right = impulse.getChannelData(1);
        for (let i = 0; i < length; i++) {
            let decay = Math.exp(-i / (rate * 0.5));
            left[i] = (Math.random() * 2 - 1) * decay;
            right[i] = (Math.random() * 2 - 1) * decay;
        }
        convolverNode.buffer = impulse;
    }

    function startSound(xNorm, yNorm) {
        initAudio();
        if (osc) stopSound();
        isTouching = true;

        osc = audioCtx.createOscillator();
        osc.type = currentWave;

        filterNode = audioCtx.createBiquadFilter();
        filterNode.type = 'lowpass';
        let cutoff = 100 + Math.pow(yNorm, 2) * 5000;
        filterNode.frequency.setValueAtTime(cutoff, audioCtx.currentTime);
        filterNode.Q.setValueAtTime(4, audioCtx.currentTime);

        gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.03);

        let freq = 110 * Math.pow(2, xNorm * 4);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        osc.connect(filterNode);
        filterNode.connect(gainNode);
        gainNode.connect(masterGain);

        osc.start();

        // Gestione Arp Gate se attivo
        if (document.getElementById('btnArp').classList.contains('active')) {
            startArpGate();
        }
    }

    function updateSound(xNorm, yNorm) {
        if (!osc || !audioCtx) return;
        let freq = 110 * Math.pow(2, xNorm * 4);
        osc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.01);

        let cutoff = 100 + Math.pow(yNorm, 2) * 5000;
        filterNode.frequency.setTargetAtTime(cutoff, audioCtx.currentTime, 0.01);
    }

    function startArpGate() {
        if (arpInterval) clearInterval(arpInterval);
        let open = true;
        arpInterval = setInterval(() => {
            if (!isTouching || !gainNode) return;
            open = !open;
            let target = open ? 1 : 0.05;
            gainNode.gain.setTargetAtTime(target, audioCtx.currentTime, 0.02);
        }, 120); // Velocità pulsa
    }

    function stopSound() {
        if (arpInterval) {
            clearInterval(arpInterval);
            arpInterval = null;
        }
        isTouching = false;
        if (osc && audioCtx) {
            try {
                gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
                let oldOsc = osc;
                setTimeout(() => {
                    oldOsc.stop();
                    oldOsc.disconnect();
                }, 60);
            } catch (e) {}
            osc = null;
        }
    }

    function handleTouch(e) {
        e.preventDefault();
        const rect = pad.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        let x = clientX - rect.left;
        let y = clientY - rect.top;

        x = Math.max(0, Math.min(x, rect.width));
        y = Math.max(0, Math.min(y, rect.height));

        touchPoint.style.left = `${x}px`;
        touchPoint.style.top = `${y}px`;
        touchPoint.style.display = 'block';
        kaosText.style.opacity = '0.2';

        let normalizedX = x / rect.width;
        let normalizedY = 1 - (y / rect.height);

        if (!osc) {
            startSound(normalizedX, normalizedY);
        } else {
            updateSound(normalizedX, normalizedY);
        }
    }

    function endTouch() {
        touchPoint.style.display = 'none';
        kaosText.style.opacity = '1';
        stopSound();
    }

    pad.addEventListener('pointerdown', handleTouch);
    pad.addEventListener('pointermove', (e) => { if (e.buttons > 0 || e.pointerType === 'touch') handleTouch(e); });
    pad.addEventListener('pointerup', endTouch);
    pad.addEventListener('pointerleave', endTouch);

    document.querySelectorAll('[data-wave]').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('[data-wave]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentWave = btn.getAttribute('data-wave');
            if (osc) osc.type = currentWave;
        };
    });

    const volumeRange = document.getElementById('volumeRange');
    const volumeLabel = document.getElementById('volumeLabel');
    volumeRange.oninput = (e) => {
        masterVolume = parseInt(e.target.value) / 100;
        volumeLabel.textContent = `VOLUME: ${e.target.value}%`;
        if (masterGain && audioCtx) {
            masterGain.gain.setTargetAtTime(masterVolume * 0.3, audioCtx.currentTime, 0.02);
        }
    };

    // Toggle Effetti in tempo reale
    document.getElementById('btnDelay').onclick = function() {
        this.classList.toggle('active');
        audioCtx = null; // Ricarica routing audio al prossimo tocco
    };
    document.getElementById('btnReverb').onclick = function() {
        this.classList.toggle('active');
        audioCtx = null;
    };
    document.getElementById('btnArp').onclick = function() {
        this.classList.toggle('active');
    };
</script>

</body>
</html>
